  image:
    repository: bitnamilegacy/redis
    tag: 7.0.2-debian-11-r7
  enabled: true
  master:
    resources:
      limits:
        memory: "512Mi"
        cpu: "100m"
      requests:
        memory: "256Mi"
        cpu: "20m"
  architecture: standalone
  auth:
    password: $REDIS_PASSWORD
solr:
  enabled: false

externalFcrepoHost: fcrepo.fcrepo.svc.cluster.local

