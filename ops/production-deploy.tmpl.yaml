extraVolumeMounts: &volMounts
  - name: uploads
    mountPath: /app/samvera/hyrax-webapp/tmp/imports
    subPath: imports
  - name: uploads
    mountPath: /app/samvera/hyrax-webapp/tmp/exports
    subPath: exports
  - name: uploads
    mountPath: /app/samvera/hyrax-webapp/public/system
    subPath: public-system
  - name: uploads
    mountPath: /app/samvera/hyrax-webapp/public/uploads
    subPath: public-uploads
  - name: uploads
    mountPath: /app/samvera/hyrax-webapp/tmp/network_files
    subPath: network-files
  - name: uploads
    mountPath: /app/samvera/hyrax-webapp/storage/files
    subPath: storage-files
  - name: uploads
    mountPath: /app/samvera/hyrax-webapp/log/rack_attack
    subPath: rack-attack
  # CAUTION: these three start out empty. Since RAILS_SERVE_STATIC_FILES=true,
  # do not deploy this change until the initContainer that copies the image's
  # baked-in assets/pdf.js/uv into these subPaths (see coordinated
  # asset-copy-on-deploy work) lands in the same rollout - otherwise this
  # shadows the real baked-in files and breaks static asset serving.
  - name: uploads
    mountPath: /app/samvera/hyrax-webapp/public/assets
    subPath: public-assets
  - name: uploads
    mountPath: /app/samvera/hyrax-webapp/public/pdf.js
    subPath: public-pdfjs
  - name: uploads
    mountPath: /app/samvera/hyrax-webapp/public/uv
    subPath: public-uv

# Populates the `uploads` PVC subPaths mounted above (public-assets/public-pdfjs/
# public-uv) from this deploy's own image, since public/assets, public/pdf.js,
# and public/uv are baked in at build time and otherwise exist nowhere but the
# Rails container's own filesystem. Runs on every web pod start (not just
# deploys, matching the existing load-solr-config/db-setup initContainer
# pattern in this chart). Mounts the destination at /mnt/shared-assets/* -
# deliberately NOT at the same path as the source - so the copy's own
# destination mount can never shadow the baked-in files it's reading from.
# rsync writes via temp-file-then-rename, so two replicas copying identical
# fingerprinted content concurrently during a rolling deploy can never expose
# a partially-written file to nginx or Rails.
extraInitContainers:
  - name: sync-static-assets
    image: "ghcr.io/$REPO_LOWER/web:$TAG"
    imagePullPolicy: IfNotPresent
    command:
      - sh
      - -c
      - |
        set -e
        # public/assets is fingerprinted per-deploy and grows without bound if
        # never pruned. --no-times forces rsync to refresh the destination
        # file's mtime every time a pod start still finds it in the current
        # image, regardless of whether its content changed - that gives the
        # prune below a reliable "still live in some current pod" signal
        # rather than assuming Sprockets always produces a fresh build-time
        # mtime (true today, but not guaranteed if CI ever caches
        # tmp/cache/assets across image builds).
        rsync -a --no-times --no-owner --no-group /app/samvera/hyrax-webapp/public/assets/ /mnt/shared-assets/assets/
        # pdf.js and uv are vendored viewer libraries with fixed (non-hashed)
        # filenames that change only when the underlying dependency bumps, not
        # on every deploy - copy additively, never delete. Mirroring these
        # with --delete risks yanking a file out from under an old replica's
        # already-loaded page mid-rolling-deploy (pdf.js hard-fails on a
        # main/worker script version mismatch); since they rarely change, the
        # accumulation problem public/assets has doesn't apply here.
        rsync -a --no-owner --no-group /app/samvera/hyrax-webapp/public/pdf.js/ /mnt/shared-assets/pdf.js/
        rsync -a --no-owner --no-group /app/samvera/hyrax-webapp/public/uv/ /mnt/shared-assets/uv/
        # Keep 7 days of fingerprinted assets: comfortably outlives both a
        # rolling deploy and any realistic open browser tab, while bounding
        # EFS growth to roughly a week's worth of unique deploys. `|| true`
        # tolerates the other replica's initContainer already deleting the
        # same file.
        find /mnt/shared-assets/assets -type f -mtime +7 -delete || true
        echo "static asset sync complete"
    volumeMounts:
      - name: uploads
        mountPath: /mnt/shared-assets/assets
        subPath: public-assets
      - name: uploads
        mountPath: /mnt/shared-assets/pdf.js
        subPath: public-pdfjs
      - name: uploads
        mountPath: /mnt/shared-assets/uv
        subPath: public-uv

ingress:
  enabled: true
  ingressClassName: "nginx-ingress"
  hosts:
    - host: '*.hykuup.com'
      paths:
        - path: /
    - host: mobius-origin.notch8.cloud
      paths:
        - path: /
  annotations: {
    nginx.org/client-max-body-size: "0",
    nginx.org/proxy-connect-timeout: "120s",
    cert-manager.io/cluster-issuer: letsencrypt-production-dns
  }
  tls:
    - secretName: wildcard-tls-secret
      hosts:
        - '*.hykuup.com'
    - secretName: mobius-origin-tls
      hosts:
        - mobius-origin.notch8.cloud

