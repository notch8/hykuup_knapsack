global:
  hyraxHostName: hykuup-knapsack-production-hyrax

nginx:
  enabled: true
  service:
    type: ClusterIP
  image:
    # Built from the `hyku-nginx` Dockerfile stage, which bakes public/assets,
    # public/pdf.js, and public/uv in from the `hyku-web` stage of the exact
    # same commit - no shared volume/copy step needed for these anymore.
    # Still based on registry.gitlab.com/notch8/scripts/bitnami-nginx (see
    # Dockerfile) since the server block below references that image's
    # bots.d/{ddos,blockbots}.conf includes.
    registry: ghcr.io
    repository: "$REPO_LOWER/nginx"
    tag: "$TAG"
  extraVolumes:
    - name: "uploads"
      persistentVolumeClaim:
        claimName: "{{ .Values.global.hyraxHostName }}-uploads"
    - name: "branding"
      persistentVolumeClaim:
        claimName: "{{ .Values.global.hyraxHostName }}-branding"
  extraVolumeMounts:
    - name: uploads
      mountPath: /app/samvera/hyrax-webapp/public/system
      subPath: public-system
    - name: branding
      mountPath: /app/samvera/hyrax-webapp/public/branding

  # Serves /system (Site branding images: logo/banner/favicon) and /branding
  # (per-tenant branding assets) directly from shared EFS PVCs so these
  # requests never tie up a Puma worker.
  # NOTE: deliberately excludes /uploads/, unlike /system/ that directory may
  # hold access-controlled content Rails is supposed to gate - matches the
  # convention already used for other notch8 Hyrax apps' nginx server blocks.
  # All other paths fall through to the Rails app unchanged.
  serverBlock: |-
    upstream rails_app {
      server {{ .Values.global.hyraxHostName }};
    }

    map ${DOLLAR}status ${DOLLAR}loggable {
        ~^444  0;
        default 1;
    }

    log_format loki 'host=${DOLLAR}host ip=${DOLLAR}http_x_forwarded_for remote_user=${DOLLAR}remote_user [${DOLLAR}time_local] '
                      'request="${DOLLAR}request" status=${DOLLAR}status bytes=${DOLLAR}body_bytes_sent '
                      'referer="${DOLLAR}http_referer" agent="${DOLLAR}http_user_agent" request_time=${DOLLAR}request_time upstream_response_time=${DOLLAR}upstream_response_time upstream_response_length=${DOLLAR}upstream_response_length';

    error_log  /opt/bitnami/nginx/logs/error.log warn;

    # Lets ActionCable's websocket handshake upgrade instead of falling through to a plain HTTP request Rails 404s.
    map ${DOLLAR}http_upgrade ${DOLLAR}connection_upgrade {
        default upgrade;
        ''      '';
    }
    # Cloudflare ips see for refresh
    # https://support.cloudflare.com/hc/en-us/articles/200170786-Restoring-original-visitor-IPs-logging-visitor-IP-addresses
    # update list https://www.cloudflare.com/ips/
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    include /opt/bitnami/nginx/conf/conf.d/*.conf;
    server {
        listen 8080;
        server_name _;
        root /app/samvera/hyrax-webapp/public;
        index index.html;

        client_body_in_file_only clean;
        client_body_buffer_size 32K;
        client_max_body_size 0;
        access_log /opt/bitnami/nginx/logs/access.log loki;

        sendfile on;
        send_timeout 300s;

        include /opt/bitnami/nginx/conf/bots.d/ddos.conf;
        include /opt/bitnami/nginx/conf/bots.d/blockbots.conf;

        location ~ (\.php|\.aspx|\.asp) {
        	return 404;
        }

        # deny requests for files that should never be accessed
        location ~ /\. {
          deny all;
        }

        location ~* ^.+\.(rb|log)${DOLLAR} {
          deny all;
        }
        # serve static (compiled) assets / branding images directly if they exist
        location ~ ^/(assets|branding|packs|fonts|images|javascripts|stylesheets|swfs|system|uv|pdf\.js)/ {
          try_files ${DOLLAR}uri @rails;

          gzip_static on; # to serve pre-gzipped version

          expires max;
          add_header Cache-Control public;

          # Some browsers still send conditional-GET requests if there's a
          # Last-Modified header or an ETag header even if they haven't
          # reached the expiry date sent in the Expires header.
          add_header Last-Modified "";
          add_header ETag "";
          break;
        }

        # send non-static file requests to the app server
        location / {
          try_files ${DOLLAR}uri @rails;
        }

        location @rails {
          proxy_set_header  X-Real-IP  ${DOLLAR}remote_addr;
          proxy_set_header  X-Forwarded-For ${DOLLAR}proxy_add_x_forwarded_for;
          proxy_set_header Host ${DOLLAR}http_host;
          proxy_redirect off;
          proxy_pass http://rails_app;
        }
    }

fits:
  resources:
    limits:
      memory: "4Gi"
      cpu: "1000m"
    requests:
      memory: "4Gi"
      cpu: "250m"
  enabled: true
  servicePort: 8080
  subPath: /fits
