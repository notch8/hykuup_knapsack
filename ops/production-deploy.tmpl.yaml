# Raised to 4 for the 2026-07-04 bot swarm and still what production runs.
# Drop to 2 once someone confirms the bot traffic is gone.
replicaCount: 4

imagePullSecrets:
  - name: github

resources:
  limits:
    memory: "6Gi"
    cpu: "1500m"
  requests:
    memory: "5Gi"
    cpu: "1250m"

# Chart default path "/" 404s via Hyku's tenant-CNAME check against the kubelet's pod-IP Host header.
# /monitoring/puma_stats (knapsack's own middleware, ahead of Rack::Attack/session/tenant) never touches Solr/DB/cache, so it stays cheap and up even when a dependency or the thread pool is under pressure - same endpoint Site24x7 already polls.
startupProbe:
  enabled: true
  path: "/monitoring/puma_stats"
  failureThreshold: 30
livenessProbe:
  enabled: true
  path: "/monitoring/puma_stats"
  initialDelaySeconds: 15
  periodSeconds: 60
  timeoutSeconds: 60
  failureThreshold: 6
readinessProbe:
  enabled: true
  path: "/healthz"
  initialDelaySeconds: 15
  periodSeconds: 60
  timeoutSeconds: 60
  failureThreshold: 6

brandingVolume:
  storageClass: efs-sc
derivativesVolume:
  storageClass: efs-sc
uploadsVolume:
  storageClass: efs-sc

extraVolumeMounts: &volMounts
  - name: uploads
    mountPath: /app/samvera/hyrax-webapp/tmp/imports
    subPath: imports
  - name: uploads
    mountPath: /app/samvera/hyrax-webapp/tmp/exports
    subPath: exports
  - name: uploads
    mountPath: /app/samvera/hyrax-webapp/public/system
    subPath: public-system
  - name: uploads
    mountPath: /app/samvera/hyrax-webapp/public/uploads
    subPath: public-uploads
  - name: uploads
    mountPath: /app/samvera/hyrax-webapp/tmp/network_files
    subPath: network-files
  - name: uploads
    mountPath: /app/samvera/hyrax-webapp/storage/files
    subPath: storage-files
  - name: uploads
    mountPath: /app/samvera/hyrax-webapp/log/rack_attack
    subPath: rack-attack

ingress:
  enabled: true
  ingressClassName: "nginx-ingress"
  hosts:
    - host: '*.hykuup.com'
      paths:
        - path: /
    - host: mobius-origin.notch8.cloud
      paths:
        - path: /
  annotations: {
    nginx.org/client-max-body-size: "0",
    nginx.org/proxy-connect-timeout: "120s",
    nginx.org/websocket-services: "hykuup-knapsack-production-nginx",
    cert-manager.io/cluster-issuer: letsencrypt-production-dns
  }
  tls:
    - secretName: wildcard-tls-secret
      hosts:
        - '*.hykuup.com'
    - secretName: mobius-origin-tls
      hosts:
        - mobius-origin.notch8.cloud

